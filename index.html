<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NovaCord</title>

    <link rel="stylesheet" href="style.css">

    <style>
        #loginOverlay {
            position: fixed;
            inset: 0;
            background: rgba(10, 10, 20, 0.92);
            backdrop-filter: blur(12px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }

        .login-box {
            width: min(400px, 90%);
            padding: 35px;
            border-radius: 20px;
            background: #181827;
            box-shadow: 0 20px 60px rgba(0, 0, 0, .5);
            text-align: center;
        }

        .login-box h1 {
            margin: 0 0 10px;
            color: white;
        }

        .login-box p {
            color: #aaa;
            margin-bottom: 25px;
        }

        #usernameInput {
            width: 100%;
            box-sizing: border-box;
            padding: 14px;
            border: none;
            outline: none;
            border-radius: 10px;
            background: #252538;
            color: white;
            font-size: 16px;
            margin-bottom: 15px;
        }

        #enterButton {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #5865f2;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        #enterButton:hover {
            filter: brightness(1.1);
        }

        #voicePanel {
            position: fixed;
            left: 300px;
            bottom: 20px;
            width: 260px;
            padding: 15px;
            border-radius: 15px;
            background: #181827;
            color: white;
            box-shadow: 0 10px 40px rgba(0,0,0,.45);
            z-index: 5000;
        }

        .voice-panel-title {
            font-weight: bold;
            margin-bottom: 12px;
        }

        .voice-user {
            padding: 7px;
            border-radius: 7px;
            background: #252538;
            margin-top: 5px;
        }

        .voice-controls {
            display: flex;
            gap: 8px;
            margin-top: 12px;
        }

        .voice-controls button {
            flex: 1;
            border: none;
            border-radius: 8px;
            padding: 10px;
            cursor: pointer;
            font-size: 16px;
        }
    </style>
</head>

<body>

    <div id="loginOverlay">

        <div class="login-box">

            <h1>Bem-vindo ao NovaCord 👋</h1>

            <p>
                Escolha um nome para entrar no servidor.
            </p>

            <input
                id="usernameInput"
                type="text"
                maxlength="20"
                placeholder="Digite seu nome..."
                autocomplete="off"
            >

            <button
                id="enterButton"
                type="button"
            >
                Entrar no NovaCord
            </button>

        </div>

    </div>

    <div class="app">

        <aside class="servers">

            <div class="server active">N</div>
            <div class="server">🎮</div>
            <div class="server">🔥</div>
            <div class="server">😂</div>

        </aside>

        <aside class="sidebar">

            <div class="server-header">

                <span>NovaCord</span>

                <button type="button">
                    ⌄
                </button>

            </div>

            <div class="channels">

                <div class="category">
                    TEXT CHANNELS
                </div>

                <div
                    class="channel active"
                    data-type="text"
                    data-channel="geral"
                >
                    <span>#</span>
                    <p>geral</p>
                </div>

                <div
                    class="channel"
                    data-type="text"
                    data-channel="jogos"
                >
                    <span>#</span>
                    <p>jogos</p>
                </div>

                <div
                    class="channel"
                    data-type="text"
                    data-channel="memes"
                >
                    <span>#</span>
                    <p>memes</p>
                </div>

                <div class="category">
                    VOICE CHANNELS
                </div>

                <div
                    class="channel"
                    data-type="voice"
                    data-channel="Geral"
                >
                    <span>🔊</span>
                    <p>Geral</p>
                </div>

                <div
                    class="channel"
                    data-type="voice"
                    data-channel="Jogos"
                >
                    <span>🔊</span>
                    <p>Jogos</p>
                </div>

            </div>

            <div class="user-panel">

                <div
                    class="avatar"
                    id="userAvatar"
                >
                    V

                    <div class="status"></div>

                </div>

                <div class="user-info">

                    <strong id="usernameDisplay">
                        Você
                    </strong>

                    <small>
                        Online
                    </small>

                </div>

                <button
                    class="user-button"
                    type="button"
                >
                    ⚙
                </button>

            </div>

        </aside>

        <main class="chat">

            <header class="chat-header">

                <div class="channel-title">

                    <span id="channelIcon">
                        #
                    </span>

                    <strong id="channelName">
                        geral
                    </strong>

                </div>

                <div class="header-buttons">

                    <button type="button">🔔</button>
                    <button type="button">👥</button>
                    <button type="button">🔍</button>
                    <button type="button">📌</button>
                    <button type="button">⚙</button>

                </div>

            </header>

            <section
                class="messages"
                id="messages"
            >

                <div class="welcome">

                    <div class="welcome-icon">
                        #
                    </div>

                    <h1>
                        Bem-vindo ao NovaCord!
                    </h1>

                    <p>
                        Este é o começo do canal #geral.
                    </p>

                </div>

            </section>

            <div class="message-area">

                <form id="messageForm">

                    <button
                        type="button"
                        class="add-button"
                    >
                        +
                    </button>

                    <input
                        id="messageInput"
                        type="text"
                        placeholder="Enviar mensagem em #geral"
                        autocomplete="off"
                    >

                    <button
                        type="button"
                        class="emoji-button"
                    >
                        😊
                    </button>

                    <button
                        type="submit"
                        class="send-button"
                    >
                        ➤
                    </button>

                </form>

            </div>

        </main>

    </div>

    <script src="/socket.io/socket.io.js"></script>

    <script src="script.js"></script>

</body>

</html>
