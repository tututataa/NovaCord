<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NovaCord</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="app">

        <!-- SERVIDORES -->
        <aside class="servers">

            <button class="server active" type="button">N</button>
            <button class="server" type="button">🎮</button>
            <button class="server" type="button">🔥</button>
            <button class="server" type="button">😂</button>

        </aside>


        <!-- SIDEBAR -->
        <aside class="sidebar">

            <div class="server-header">
                <span>NovaCord</span>
                <button type="button">⌄</button>
            </div>


            <div class="channels">

                <div class="category">
                    TEXT CHANNELS
                </div>


                <button
                    class="channel active"
                    type="button"
                    data-type="text"
                    data-channel="geral"
                >
                    <span>#</span>
                    <p>geral</p>
                </button>


                <button
                    class="channel"
                    type="button"
                    data-type="text"
                    data-channel="jogos"
                >
                    <span>#</span>
                    <p>jogos</p>
                </button>


                <button
                    class="channel"
                    type="button"
                    data-type="text"
                    data-channel="memes"
                >
                    <span>#</span>
                    <p>memes</p>
                </button>


                <div class="category">
                    VOICE CHANNELS
                </div>


                <button
                    class="channel voice-channel"
                    type="button"
                    data-type="voice"
                    data-channel="Geral"
                >
                    <span>🔊</span>
                    <p>Geral</p>
                </button>


                <button
                    class="channel voice-channel"
                    type="button"
                    data-type="voice"
                    data-channel="Jogos"
                >
                    <span>🔊</span>
                    <p>Jogos</p>
                </button>

            </div>


            <!-- USUÁRIO -->
            <div class="user-panel">

                <div class="avatar" id="userAvatar">
                    V
                    <div class="status"></div>
                </div>

                <div class="user-info">
                    <strong id="usernameDisplay">Você</strong>
                    <small>Online</small>
                </div>

                <button class="user-button" type="button">
                    ⚙
                </button>

            </div>

        </aside>


        <!-- CHAT -->
        <main class="chat">

            <header class="chat-header">

                <div class="channel-title">
                    <span id="channelIcon">#</span>
                    <strong id="channelName">geral</strong>
                </div>


                <div class="header-buttons">

                    <button type="button">🔔</button>
                    <button type="button">👥</button>
                    <button type="button">🔍</button>
                    <button type="button">📌</button>
                    <button type="button">⚙</button>

                </div>

            </header>


            <!-- MENSAGENS -->
            <section class="messages" id="messages">

                <div class="welcome">

                    <div class="welcome-icon">
                        #
                    </div>

                    <h1>
                        Bem-vindo ao NovaCord!
                    </h1>

                    <p>
                        Este é o começo do canal #geral.
                    </p>

                </div>

            </section>


            <!-- CAMPO DE MENSAGEM -->
            <div class="message-area">

                <form id="messageForm">

                    <button
                        type="button"
                        class="add-button"
                    >
                        +
                    </button>


                    <input
                        id="messageInput"
                        type="text"
                        placeholder="Enviar mensagem em #geral"
                        autocomplete="off"
                    >


                    <button
                        type="button"
                        class="emoji-button"
                    >
                        😊
                    </button>


                    <button
                        type="submit"
                        class="send-button"
                    >
                        ➤
                    </button>

                </form>

            </div>

        </main>

    </div>


    <!-- PAINEL PARA ESCOLHER NOME -->
    <div
        class="login-overlay"
        id="loginOverlay"
    >

        <div class="login-box">

            <div class="login-logo">
                N
            </div>

            <h1>
                Bem-vindo ao NovaCord!
            </h1>

            <p>
                Escolha um nome para entrar no servidor.
            </p>

            <input
                id="usernameInput"
                type="text"
                maxlength="20"
                placeholder="Digite seu nome"
                autocomplete="off"
            >

            <button
                id="enterButton"
                type="button"
            >
                Entrar no NovaCord
            </button>

        </div>

    </div>


    <!-- SOCKET.IO -->
    <script src="/socket.io/socket.io.js"></script>

    <!-- SCRIPT DO NOVACORD -->
    <script src="script.js"></script>

</body>

</html>
